<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>we gone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-transform: lowercase;
        }

        .timer-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #666666;
            font-family: monospace;
        }

        .visit-counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #444444;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.4s ease;
        }

        .visit-counter.loaded {
            color: #666666;
        }

        .visit-counter .count {
            color: #aaaaaa;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: #888888;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="timer-bar">
        redirecting in <span id="timer">10</span>s
    </div>

    <div class="visit-counter" id="visit-counter">
        <span>total visits:</span>
        <span class="count" id="visit-count">...</span>
    </div>

    <div class="container">
        <h1>we've moved!</h1>
        <p>keyzzilla.com is out of service. we are now located at keyzz.win. thanks for all the support and all the visits. &lt;3</p>
        <a href="https://keyzz.win" id="redirect-link">go to keyzz.win &rarr;</a>
    </div>

    <script>
        // --- Redirect timer ---
        const targetUrl = 'https://keyzz.win';
        let seconds = 10;
        const timerElement = document.getElementById('timer');

        const interval = setInterval(() => {
            seconds--;
            if (timerElement) {
                timerElement.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 1000);

        // --- Live visit counter via CountAPI ---
        (async () => {
            const counterEl = document.getElementById('visit-counter');
            const countEl = document.getElementById('visit-count');
            const BASELINE_VISITS = 86196; // known lifetime visits before this counter started
            try {
                const res = await fetch('https://api.countapi.xyz/hit/keyzzilla-com/visits');
                const data = await res.json();
                const total = BASELINE_VISITS + data.value;
                countEl.textContent = total.toLocaleString();
                counterEl.classList.add('loaded');
            } catch (e) {
                countEl.textContent = 'n/a';
            }
        })();
    </script>
</body>

</html>
